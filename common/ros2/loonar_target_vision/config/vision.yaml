loonar_target_vision:
  ros__parameters:
    # Keep dimensions equal to VIDEO_PROFILE, fps equal to VISION_FPS.
    source_width: 640
    source_height: 360
    source_fps: 10
    vision_socket: /run/loonar/vision.sock
    # Install a validated NCNN directory with install-vision-runtime.sh MODEL_DIR.
    model_path: /var/lib/loonar/vision/best_ncnn_model
    model_sha256: ""
    input_height: 640
    input_width: 384
    confidence: 0.35
    cpu_threads: 2
    max_result_age_ms: 500.0
    ground_station_ip: 10.254.254.2
    udp_port: 5601
