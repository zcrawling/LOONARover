# LOONAR initial local odometry, ROS 2 Jazzy / robot_localization.
#
# Measurements deliberately fused in this first stage:
#   /wheel/odom: linear velocity x only (twist.covariance[0])
#   /imu/data:   angular velocity z only (angular_velocity_covariance[8])
#
# No wheel pose, wheel yaw, IMU orientation, acceleration, ToF, map, GPS, or
# control input is fused here. The result is continuous local dead reckoning,
# not an absolute position estimate. EKF alone is not a slip/contact detector.

ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true
    predict_to_current_time: false

    # The only dynamic TF owner must be this node: odom -> base_link.
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # No command is used as a state-estimation measurement or prediction input.
    use_control: false

    odom0: /wheel/odom
    # x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 20

    imu0: /imu/data
    # Fuse calibrated gyro z only. In particular, do not fuse orientation yaw
    # until its ENU convention and real covariance have been measured.
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 50
    imu0_remove_gravitational_acceleration: false

    # Keep robot_localization's built-in process-noise baseline initially.
    # Do not add process_noise_covariance until bag-based tuning justifies it.
