# Calibration starting values, NOT measured rover limits. SI units, angles in radians.
# Confirm footprint, mount, depth convention and stopping distances before motion.
/**:
  ros__parameters:
    sensor_timeout: 0.3
    sync_tolerance: 0.06
    base_frame: 'base_link'
    wheel_velocity_threshold: 0.025
    gyro_threshold: 0.04
    gyro_std_threshold: 0.015
    accel_std_threshold: 0.12
    minimum_duration: 0.5
    settling_min_time: 0.4
    max_step_up: 0.035
    max_step_down: 0.035
    max_slope: 0.22
    max_cross_slope: 0.17
    max_roughness: 0.012
    max_drop_depth: 0.035
    max_unknown_ratio: 0.0
    min_confidence: 0.6
    robot_width: 0.3
    robot_length: 0.32
    wheel_track: 0.21
    wheel_radius: 0.098
    tail_offset: 0.2
    safety_margin: 0.04
    heading_min: -0.6981317
    heading_max: 0.6981317
    heading_step: 0.1745329
    lookahead_distance: 0.8
    min_drive_distance: 0.1
    max_drive_distance: 0.25
    distance_safety_factor: 0.6
    stopping_margin: 0.07
    w_slope: 1.0
    w_roughness: 1.0
    w_step: 1.0
    w_unknown: 2.0
    w_risk: 2.0
    w_turn: 0.3
    w_heading_change: 0.3
    w_progress: 1.0
    map_max_age: 3.0
    straight_slow_speed: 0.05
    straight_normal_speed: 0.1
    rotate_speed: 0.2
    yaw_tolerance: 0.025
    distance_tolerance: 0.005
    settle_gyro_threshold: 0.035
    straight_yaw_kp: 1.2
    straight_yaw_kd: 0.15
    max_heading_correction: 0.2
    distance_kp: 0.8
    rotate_kp: 1.0
    max_primitive_timeout: 20.0
    max_rotate_angle: 1.0
    max_roll: 0.35
    max_pitch: 0.35
    max_shock: 20.0
    max_wheel_speed: 0.5
    frame_count: 4
    capture_timeout: 3.0
    phase_timeout: 25.0
    recovery_step: 0.35
    recovery_max_angle: 6.2831853
    recovery_rotation_clearance_verified: false
    calibration_confirmed: false
    enable_motion: false
    autostart: false
    # Emergency clearance from body boundary: margin + v*T + v^2/(2*a).
    # T includes sensor_timeout. These braking values need physical validation.
    brake_reaction_time: 0.10
    brake_deceleration: 0.20
    collision_half_width: 0.2
    # CAD base_link is at the axle, assumed 0.098 m above level ground.
    # Low relief (<= max_step_up) is evaluated by the terrain planner.
    # The guard also honors a stricter collision_min_height when configured.
    collision_min_height: -0.063
    collision_max_height: 0.602
    collision_min_points: 4
    min_valid_ratio: 0.1
    amplitude_threshold: 30.0
    min_range: 0.15
    max_range: 2.5
    pixel_stride: 4
    gravity_magnitude_min: 8.0
    gravity_magnitude_max: 12.0
    source: 'topics'
    helper: ''
    optical_frame: 'tof_optical_frame'
    depth_scale: 0.001
    source_depth_is_radial: false
    source_rectified: false
    publish_raw: true
    resolution: 0.05
    x_min: -0.5
    x_max: 2.0
    y_min: -1.0
    y_max: 1.0
    plane_fit_radius: 0.15
    min_points_per_cell: 3
    min_plane_neighbors: 6
    step_support: 2
    step_noise: 0.015
    min_valid_samples: 3
    temporal_mad_limit: 0.025
    max_capture_tilt_change: 0.025
    roi_top: 0
    spatial_median: false
    self_rear: 0.2
    self_front: 0.16
    self_half_width: 0.15
    self_z_min: -0.078
    self_z_max: 0.402
