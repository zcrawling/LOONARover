[platformio]
default_envs = teensy41_usb
src_dir = src
include_dir = include
lib_dir = ../../libs

[env:teensy41]
platform = https://github.com/tsandmann/platform-teensy.git#f2a89fab6fbe936dc383a6565872eb30545984a6
board = teensy41
framework = arduino
lib_deps =
  https://github.com/tsandmann/freertos-teensy.git#b1943409de50e0514469ae0fc69a6f9ae17f6118
  https://github.com/adafruit/Adafruit_BNO08x.git#525d050e1583a7444f18d020c2cdea70471fb77f
  https://github.com/tonton81/WDT_T4.git#1910b57d24468cd3419959118a2e1e6192f5e7fa
  adafruit/Adafruit BusIO@1.17.4
  adafruit/Adafruit Unified Sensor@1.1.15
build_src_filter = +<main.cpp> +<v2/*.cpp>
extra_scripts = pre:board_config.py
build_unflags = -std=gnu++14
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wformat=1
  -DUSB_SERIAL
  -DTEENSY_OPT_FASTER_LTO
  -I../../interfaces/generated/c

# Initial bench connection: same binary wire frames over the Teensy's USB CDC port.
# Explicit selection prevents changing the eventual Pi HAT UART build by accident.
[env:teensy41_usb]
extends = env:teensy41
build_flags =
  ${env:teensy41.build_flags}
  -DLOONAR_CONTROL_USB_CDC

[env:payload41_usb]
extends = env:teensy41
build_flags =
  ${env:teensy41.build_flags}
  -DLOONAR_CONTROL_USB_CDC
