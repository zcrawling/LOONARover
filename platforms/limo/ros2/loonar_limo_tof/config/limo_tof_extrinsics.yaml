# Physical base_link -> tof_link transform for this particular LIMO.
#
# Status: measured on the LIMO, 2026-09-03.
# base_link is the vendor model's wheelbase midpoint and lateral centre.
# ToF centre: 0.183 m above the floor; vendor base_link: 0.150 m above floor.
# x is approximate; refine after the first planar-grid check.
#
# The fixed and already verified part is published by the Orbbec driver:
#   tof_link -> tof_depth_frame -> tof_depth_optical_frame
#
# Expected ROS convention: +x forward, +y left, +z up; angles roll/pitch/yaw
# in radians.  This file is deliberately data-only documentation: ROS launch
# arguments are explicit so an unmeasured transform cannot silently start.
base_frame: base_link
tof_frame: tof_link
mount_x_m: 0.150
mount_y_m: 0.000
mount_z_m: 0.033
# Assumed level and forward-facing. Verify with a level/plane observation.
mount_roll_rad: 0.000
mount_pitch_rad: 0.000
mount_yaw_rad: 0.000
