# Prototype only. Real GroundLink compatibility is not yet agreed.
[network]
target = "mock"
host = "127.0.0.1"
port = 17443
connect_timeout = 3.0
write_timeout = 3.0
reconnect_delays = [1.0, 2.0, 4.0, 8.0, 10.0]

[heartbeat]
interval = 2.0
degraded_after = 6.0
disconnect_after = 20.0

[command]
payload_receipt_timeout = 20.0

[tcp]
keepalive = true
keepidle = 10
keepinterval = 3
keepcount = 3
# 0 leaves TCP_USER_TIMEOUT at the OS default.
user_timeout_ms = 0

[display]
refresh = 1.0
stale_after = 5.0
event_limit = 100

[video]
port = 5600
bitrates_mbps = [1, 3, 5]

# Real GroundLink keyboard control values.
[manual_control]
linear_speed_mps = 0.1
angular_speed_radps = 0.5
repeat_interval_ms = 100
forward_key = "PAGE_UP"
left_key = "HOME"
reverse_key = "PAGE_DOWN"
right_key = "END"
stop_key = "SPACE"

[mock]
status_interval = 1.0
sample_interval = 1.0
receipt_delay = 0.0
payload_duration = 30.0
send_pong = true
# Deliberate fault injection: 0 disables forced disconnection.
disconnect_after = 0.0

[diagnostics]
refresh = 1.0
probe_interval = 10.0
stale_after = 5.0
